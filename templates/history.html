{% extends "base.html" %}

{% block title %}History - BankingAI{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Activity History</h1>
    <p>View all your past predictions and chat interactions.</p>
</div>

<div class="tabs">
    <button class="tab-btn active" data-tab="loanTab">Loan Predictions</button>
    <button class="tab-btn" data-tab="fraudTab">Fraud Checks</button>
    <button class="tab-btn" data-tab="chatTab">Chat History</button>
</div>

<div id="loanTab" class="tab-content active">
    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Date</th><th>Result</th><th>Confidence</th><th>Details</th></tr>
                </thead>
                <tbody id="loanHistoryBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="fraudTab" class="tab-content">
    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Date</th><th>Result</th><th>Risk Score</th><th>Details</th></tr>
                </thead>
                <tbody id="fraudHistoryBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="chatTab" class="tab-content">
    <div id="chatHistoryList"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/frontend/js/history.js"></script>
{% endblock %}
