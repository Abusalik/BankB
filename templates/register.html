<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BankingAI</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1>BankingAI</h1>
                <p>Create your account</p>
            </div>

            <div id="alertBox" class="alert alert-error hidden"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <p class="auth-link">
                Already have an account? <a href="/">Sign in</a>
            </p>
        </div>
    </div>

    <script>
        window.__BACKEND_URL__ = "{{ backend_url | default('') }}";
    </script>
    <script src="/frontend/js/config.js"></script>
    <script src="/frontend/js/app.js"></script>
    <script src="/frontend/js/register.js"></script>
</body>
</html>
