{% extends "base.html" %}

{% block title %}Fraud Detection - BankingAI{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Credit Card Fraud Detection</h1>
    <p>Analyze transactions for potential fraudulent activity.</p>
</div>

<div class="card">
    <div id="alertBox" class="alert alert-error hidden"></div>

    <form id="fraudForm" class="prediction-form">
        <div class="form-group">
            <label for="time">Transaction Time (seconds)</label>
            <input type="number" id="time" placeholder="0" required step="any">
        </div>
        <div class="form-group">
            <label for="amount">Transaction Amount ($)</label>
            <input type="number" id="amount" placeholder="100.00" required step="any" min="0">
        </div>
        {% for i in range(1, 29) %}
        <div class="form-group">
            <label for="v{{ i }}">V{{ i }}</label>
            <input type="number" id="v{{ i }}" placeholder="0.0" step="any" value="0">
        </div>
        {% endfor %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Detect Fraud</button>
        </div>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/frontend/js/fraud.js"></script>
{% endblock %}
