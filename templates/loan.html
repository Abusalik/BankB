{% extends "base.html" %}

{% block title %}Loan Prediction - BankingAI{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Loan Approval Prediction</h1>
    <p>Enter applicant details to predict loan approval status.</p>
</div>

<div class="card">
    <div id="alertBox" class="alert alert-error hidden"></div>

    <form id="loanForm" class="prediction-form">
        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <div class="form-group">
            <label for="married">Married</label>
            <select id="married" required>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>
        <div class="form-group">
            <label for="dependents">Dependents</label>
            <select id="dependents" required>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3+">3+</option>
            </select>
        </div>
        <div class="form-group">
            <label for="education">Education</label>
            <select id="education" required>
                <option value="Graduate">Graduate</option>
                <option value="Not Graduate">Not Graduate</option>
            </select>
        </div>
        <div class="form-group">
            <label for="selfEmployed">Self Employed</label>
            <select id="selfEmployed" required>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>
        <div class="form-group">
            <label for="propertyArea">Property Area</label>
            <select id="propertyArea" required>
                <option value="Urban">Urban</option>
                <option value="Rural">Rural</option>
                <option value="Semiurban">Semiurban</option>
            </select>
        </div>
        <div class="form-group">
            <label for="applicantIncome">Applicant Income ($)</label>
            <input type="number" id="applicantIncome" placeholder="5000" required min="0">
        </div>
        <div class="form-group">
            <label for="coapplicantIncome">Co-applicant Income ($)</label>
            <input type="number" id="coapplicantIncome" placeholder="2000" required min="0">
        </div>
        <div class="form-group">
            <label for="loanAmount">Loan Amount ($1000s)</label>
            <input type="number" id="loanAmount" placeholder="150" required min="1">
        </div>
        <div class="form-group">
            <label for="loanTerm">Loan Term (months)</label>
            <input type="number" id="loanTerm" placeholder="360" required min="1">
        </div>
        <div class="form-group">
            <label for="creditHistory">Credit History</label>
            <select id="creditHistory" required>
                <option value="1">Good (1)</option>
                <option value="0">Bad (0)</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Predict Loan Approval</button>
        </div>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/frontend/js/loan.js"></script>
{% endblock %}
