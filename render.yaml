services:
  - type: web
    name: bankingai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: HF_TOKEN
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: bankingai-db
          property: connectionString

databases:
  - name: bankingai-db
    databaseName: bankingai
    user: bankingai
    plan: free
